[project]
name = "welstra"
version = "0.1.0"
description = "AI-powered job matching platform with agent pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn>=0.35.0",
    "pydantic==2.5.0",
    "pypdf==6.9.2",
    "python-multipart>=0.0.9",   # required for FastAPI file uploads
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false